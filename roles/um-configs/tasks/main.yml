- name: Create maintain directory
  file:
    path: "{{item}}"
    state: directory
    mode: "0755"
  become: yes
  with_items:
    - "{{ volume_path }}/errors"

- name: Copy HAProxy Dockerfile Testlab.
  template:
    src: "templates/errors/maintenance.html"
    dest: "{{ volume_path }}/errors/maintenance.html"
  become: yes
