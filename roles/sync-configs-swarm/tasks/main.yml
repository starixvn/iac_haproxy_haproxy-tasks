##### Clean Deployment directory
- name: Clean Deployment directory
  file:
    state: absent
    path: "{{item}}"
  become: yes
  run_once: true
  delegate_to: localhost
  ignore_errors: yes
  with_items:
    - "/srv/compiled"

- name: Create Deployment directory
  file:
    path: "{{item}}"
    state: directory
    mode: "0755"
  become: yes
  run_once: true
  delegate_to: localhost
  with_items:
    - "/srv/compiled"
##### Clean folder haproxy on Target servers
- name: Clean HAProxy working_dir
  shell: rm -R {{ volume_path }}/*
  become: yes
  ignore_errors: yes
  when: clean_working_dir is defined and clean_working_dir == "true"

################ Set git repo
- name: Checkout source code
  git: 
    repo: "git@gitlab.starixsoft.com:compiled/haproxy.git"
    dest: /srv/compiled/haproxy
    key_file: "{{key_file}}"
    accept_hostkey: true
    update: yes
    #version: "{{branch_name | default('HEAD')}}"
  become: yes
  run_once: true
  register: command_result
  delegate_to: localhost
  #when: team == "nexcel"
  #when: team == "luminet"

############# HAProxy Configuration

#- name: Exterminate
#  pause:
#    prompt: Press return to continue. Press Ctrl+c and then "a" to abort
##########Target servers
- name: Copy HAProxy cfg to target servers for testing
  copy: 
    src: "/srv/compiled/haproxy/{{org}}/{{ env }}/"
    dest: "{{ volume_path }}/"
  become: yes

- name: Copy HAProxy Dockerfile Testlab.
  template:
    #src: "templates/{{team}}/check-config.Dockerfile_{{env}}.j2"
    src: "templates/check-config.Dockerfile.j2"
    dest: "{{ volume_path }}/Dockerfile"
  become: yes

- name: Remove HAProxy image for syntax check
  shell: docker image rm haproxy-check-config
  ignore_errors: yes
  become: yes

- name: Build HAProxy container for syntax check
  docker_image:
    name: haproxy-check-config
    build:
      path: "{{ volume_path }}"
    state: present
  #become: yes

#- name: Build HAProxy container for syntax check 2
#  shell: cd {{ volume_path }} && docker build -t haproxy-check-config .
#  become: yes

- name: Check HAProxy config
  shell: docker run -it --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg
  become: yes

- name: Copy HAProxy configuration
  copy:
    src: "/srv/compiled/haproxy/{{org}}/{{ env }}/configs/{{ config_filename }}"
    dest: "{{ volume_path }}"
  become: yes