##########Target servers
- name: Copy HAProxy cfg to target servers for testing
  copy:
    src: "/srv/{{team}}/compiled/deploy/{{ env }}/configs/{{ config_filename }}"
    dest: "{{ volume_path }}/configs"
  become: yes

- name: Copy map configuration {{ env }} {{team}}
  copy:
    src: "/srv/{{team}}/compiled/deploy/{{ env }}/maps/"
    dest: "{{ volume_path }}/maps"
  become: yes

- name: Copy whitelist configuration {{ env }} .
  when: env != "local"
  template:
    src: "/srv/{{team}}/haproxy-default/{{item}}"
    dest: "{{ volume_path }}/{{item}}"
  become: yes
  with_items:
    - whitelisted.ips

- name: Copy SSL Certs configuration lumi {{ env }}
  when: team == "luminet" and env == "local" or team == "luminet" and env == "local_test"
  template:
    src: "/srv/{{team}}/haproxy-default/certs/{{item}}"
    dest: "{{ volume_path }}/{{item}}"
  become: yes
  with_items:
    - "{{luminet_cert_files}}"

- name: Copy SSL Certs configuration nexcel {{ env }}
  when: team == "nexcel" and env == "nexprod" or team == "nexcel" and env == "local" or team == "nexcel" and env == "local_test"
  template:
    src: "/srv/{{team}}/haproxy-default/certs/{{item}}"
    dest: "{{ volume_path }}/{{item}}"
  become: yes
  with_items:
    - "{{nexcel_cert_files}}"
  #ignore_errors: yes

- name: Copy HAProxy Dockerfile Testlab.
  template:
    #src: "templates/{{team}}/check-config.Dockerfile_{{env}}.j2"
    src: "templates/check-config.Dockerfile.j2"
    dest: "{{ volume_path }}/Dockerfile"
  become: yes

- name: Remove HAProxy image for syntax check
  shell: docker image rm haproxy-check-config
  ignore_errors: yes
  become: yes

- name: Build HAProxy container for syntax check
  docker_image:
    name: haproxy-check-config
    build:
      path: "{{ volume_path }}"
    state: present
  become: yes

#- name: Build HAProxy container for syntax check 2
#  shell: cd {{ volume_path }} && docker build -t haproxy-check-config .
#  become: yes

- name: Check HAProxy config
  shell: docker run -it --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg
  become: yes

- name: backup {{ config_filename }}
  shell: cp {{ volume_path }}/{{ config_filename }} {{ volume_path }}/configs/backup_{{ config_filename }}
  become: yes

- name: Copy HAProxy configuration
  copy:
    src: "/srv/{{team}}/compiled/deploy/{{ env }}/configs/{{ config_filename }}"
    dest: "{{ volume_path }}"
  become: yes