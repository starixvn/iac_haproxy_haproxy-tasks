##### Clean folder haproxy on Target servers
- name: Create HAProxy directory
  file:
    path: "{{ volume_path }}"
    state: directory
    mode: "0777"
  become: yes

- name: Create Deployment directory
  file:
    path: "{{item}}"
    state: directory
    mode: "0777"
  become: yes
  run_once: true
  delegate_to: localhost
  with_items:
    - "/srv/{{team}}/compiled/tmp/{{ env }}"
    - "/srv/{{team}}/compiled/deploy/{{ env }}"

- name: Clean Deployment directory
  file:
    state: absent
    path: "/srv/{{team}}/compiled"
  become: yes
  run_once: true
  delegate_to: localhost
  ignore_errors: yes
  with_items:
    - "/srv/{{team}}/compiled/tmp/{{ env }}"
    - "/srv/{{team}}/compiled/deploy/{{ env }}"

- name: Clean HAProxy config directory
  file:
    state: absent
    path: "{{ volume_path }}/configs"
  become: yes
  ignore_errors: yes

- name: Create haproxy directory on Ansible server
  file:
    path: "/srv/{{team}}"
    state: directory
    mode: '0755'
  become: yes
  run_once: true
  delegate_to: localhost
################ Set git repo
- name: Checkout source code {{team}}
  git: 
    repo: "git@gitlab.nexdev.net:NEXOPS/haproxy/{{item}}.git"
    dest: /srv/{{team}}/{{item}}
    key_file: "{{key_file}}"
    accept_hostkey: true
    update: yes
  become: yes
  run_once: true
  register: command_result
  delegate_to: localhost
  with_items:
    - "haproxy-default"
    - "haproxy-rome"
    - "haproxy-olympus"
    - "haproxy-nexus"
    - "haproxy-spu"
    - "haproxy-legion"
    - "haproxy-nex3"
    - "haproxy-nexops"
  when: team == "nexcel"
###Lumi
- name: Checkout source code {{team}}
  git: 
    repo: "git@git3.nexdev.net:haproxy/{{item}}.git"
    dest: /srv/{{team}}/{{item}}
    key_file: "{{key_file}}"
    accept_hostkey: true
    update: yes
  become: yes
  run_once: true
  #register: command_result
  delegate_to: localhost
  when: team == "luminet"
  with_items:
    - "haproxy-l1"
    - "haproxy-l2"

- debug:
    var: command_result
  delegate_to: localhost
  become: yes
  run_once: true
############# HAProxy Configuration
- name: Copy HAProxy configuration
  copy:
    src: "/srv/{{team}}/{{item}}/configs/{{ env }}"
    dest: "/srv/{{team}}/compiled/tmp"
  become: yes
  run_once: true
  delegate_to: localhost
  with_items:
    - "haproxy-default"
    - "haproxy-rome"
    - "haproxy-olympus"
    - "haproxy-nexus"
    - "haproxy-spu"
    - "haproxy-legion"
    - "haproxy-nex3"
    - "haproxy-nexops"

- name: Build HAProxy configurations
  assemble:
    src: "/srv/{{team}}/compiled/tmp/{{ env }}"
    dest: "/srv/{{team}}/compiled/deploy/{{ env }}/{{ config_filename }}"
    regexp: "cfg$"
  become: yes
  run_once: true
  delegate_to: localhost

- name: Exterminate
  pause:
    prompt: Press return to continue. Press Ctrl+c and then "a" to abort

- name: Copy whitelist configuration {{ env }} .
  when: env != "local"
  template:
    src: "/srv/{{team}}/haproxy-default/{{item}}"
    dest: "{{ volume_path }}/{{item}}"
  become: yes
  with_items:
    - whitelisted.ips

- name: Copy SSL Certs configuration {{ env }}
  when: env == "local" or env == "local_test"
  template:
    src: "/srv/{{team}}/haproxy-default/certs/{{item}}"
    dest: "{{ volume_path }}/{{item}}"
  become: yes
  with_items:
    - "{{cert_files}}"
  #ignore_errors: yes

- name: Copy custom configuration {{ env }} {{team}}
  template:
    src: "/srv/{{team}}/haproxy-{{item}}/configs/{{ env }}/maps/{{item}}.map"
    dest: "{{ volume_path }}/maps/{{item}}.map"
  become: yes
  with_items:
    - "rome"
    - "olympus"
    - "nexus"
    - "spu"
    - "legion"
    - "nex3"
    - "nexops"

- name: Copy HAProxy Dockerfile Testlab.
  template:
    src: "templates/{{team}}/check-config.Dockerfile_{{env}}.j2"
    dest: "{{ volume_path }}/Dockerfile"
  become: yes

- name: Remove HAProxy image for syntax check
  shell: docker image rm haproxy-check-config
  ignore_errors: yes
  become: yes

- name: Build HAProxy container for syntax check
  docker_image:
    name: haproxy-check-config
    build:
      path: "{{ volume_path }}"
    state: present
  become: yes

#- name: Build HAProxy container for syntax check 2
#  shell: cd {{ volume_path }} && docker build -t haproxy-check-config .
#  become: yes

- name: Check HAProxy config
  shell: docker run -it --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg
  become: yes