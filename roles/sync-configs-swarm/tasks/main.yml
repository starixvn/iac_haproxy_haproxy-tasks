##### Clean Deployment directory
- name: Clean Deployment directory
  file:
    state: absent
    path: "{{item}}"
  become: yes
  run_once: true
  delegate_to: localhost
  ignore_errors: yes
  with_items:
    - "/srv/{{team}}/compiled/tmp/{{ env }}"
    - "/srv/{{team}}/compiled/deploy/{{ env }}"

- name: Create Deployment directory
  file:
    path: "{{item}}"
    state: directory
    mode: "0755"
  become: yes
  run_once: true
  delegate_to: localhost
  with_items:
    - "/srv/{{team}}/compiled/tmp/{{ env }}"
    - "/srv/{{team}}/compiled/deploy/{{ env }}/configs"
    - "/srv/{{team}}/compiled/deploy/{{ env }}/maps"
##### Clean folder haproxy on Target servers
- name: Clean HAProxy working_dir
  shell: rm -R {{ volume_path }}/*
  become: yes
  ignore_errors: yes
  when: clean_working_dir is defined and clean_working_dir == "true"

- name: Clean HAProxy config directory
  file:
    state: absent
    path: "{{ volume_path }}/configs"
  become: yes
  ignore_errors: yes

- name: Create HAProxy directory
  file:
    path: "{{item}}"
    state: directory
    mode: "0755"
  become: yes
  with_items:
    - "{{ volume_path }}/configs"
    - "{{ volume_path }}/maps"

################ Set git repo
- name: Checkout source code {{team}}
  git: 
    repo: "git@gitlab.nexdev.net:NEXOPS/haproxy/{{item}}.git"
    dest: /srv/{{team}}/{{item}}
    key_file: "{{key_file}}"
    accept_hostkey: true
    update: yes
    #version: "{{branch_name | default('HEAD')}}"
  become: yes
  run_once: true
  register: command_result
  delegate_to: localhost
  with_items:
    - "haproxy-default"
    - "haproxy-rome"
    - "haproxy-olympus"
    - "haproxy-nexus"
    - "haproxy-spu"
    - "haproxy-legion"
    - "haproxy-nex3"
    - "haproxy-nexops"
  when: team == "nexcel"

- name: Checkout source code {{team}}
  git:
    repo: "git@git3.nexdev.net:haproxy/{{item}}.git"
    dest: /srv/{{team}}/{{item}}
    key_file: "{{key_file}}"
    accept_hostkey: true
    update: yes
    #version: "{{branch_name | default('HEAD')}}"
  become: yes
  run_once: true
  #register: command_result
  delegate_to: localhost
  when: team == "luminet"
  with_items:
    - "haproxy-default"
    - "haproxy-sc1"
    - "haproxy-vg2"
    - "haproxy-vg3"
    - "haproxy-nexops"

############# HAProxy Configuration
- name: Copy all of HAProxy configs (team) to temp folder
  copy:
    src: "/srv/{{team}}/{{item}}/configs/{{ env }}"
    dest: "/srv/{{team}}/compiled/tmp"
  become: yes
  run_once: true
  delegate_to: localhost
  with_items:
    - "haproxy-default"
    - "haproxy-rome"
    - "haproxy-olympus"
    - "haproxy-nexus"
    - "haproxy-spu"
    - "haproxy-legion"
    - "haproxy-nex3"
    - "haproxy-nexops"
  when: team == "nexcel"
  ignore_errors: yes

- name: Copy all of HAProxy configs (team) to temp folder
  copy:
    src: "/srv/{{team}}/{{item}}/configs/{{ env }}"
    dest: "/srv/{{team}}/compiled/tmp"
  become: yes
  run_once: true
  delegate_to: localhost
  with_items:
    - "haproxy-default"
    - "haproxy-sc1"
    - "haproxy-vg2"
    - "haproxy-vg3"
    - "haproxy-nexops"
  when: team == "luminet"
  ignore_errors: yes

- name: collect map configuration {{ env }} {{team}}
  copy:
    src: "/srv/{{team}}/compiled/tmp/{{ env }}/special-maps/"
    dest: "/srv/{{team}}/compiled/deploy/{{ env }}/maps/"
  become: yes
  run_once: true
  delegate_to: localhost

- name: Build HAProxy configurations
  assemble:
    src: "/srv/{{team}}/compiled/tmp/{{ env }}"
    dest: "/srv/{{team}}/compiled/deploy/{{ env }}/configs/{{ config_filename }}"
    regexp: "cfg$"
  become: yes
  run_once: true
  delegate_to: localhost

- name: Build HAProxy Map configurations
  assemble:
    src: "/srv/{{team}}/compiled/tmp/{{ env }}/maps"
    dest: "/srv/{{team}}/compiled/deploy/{{ env }}/maps/hosts.map"
    regexp: "map$"
  become: yes
  run_once: true
  delegate_to: localhost

