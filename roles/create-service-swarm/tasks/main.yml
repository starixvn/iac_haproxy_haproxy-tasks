- name: Verify stacks directory exists (on first swarm node)
  #when: inventory_hostname == groups['haproxy'][0]
  file:
    path: "/home/{{ansible_user}}/stacks"
    state: directory

- name: Copy docker-compose file
  #when: inventory_hostname == groups['haproxy'][0]
  template:
    src: 'templates/docker-compose-stack.yml.j2'
    dest: /home/{{ansible_user}}/stacks/haproxy-stack.yml
  become: yes

- name: Pull HAProxy image
  shell: |
    cd /home/{{ansible_user}}/stacks
    docker-compose -f haproxy-stack.yml pull
  #ignore_errors: yes

- name: remove existed haproxy service
  when: inventory_hostname in groups['swarm_managers'] # and inventory_hostname == groups['haproxy'][0]
  shell: |
    docker service rm haproxy_service
  run_once: true
  ignore_errors: yes

- name: Create network
  docker_network:
    name: "{{item}}"
    driver: "overlay"
    attachable: true
  with_items: '{{swarm_networks}}'
  ignore_errors: yes
  become: yes

- name: Create network NexOps
  docker_network:
    name: "{{swarm_network_nexops}}"
    driver: "overlay"
    attachable: true
  ignore_errors: yes
  become: yes

- name: Deploy haproxy service
  when: inventory_hostname in groups['swarm_managers'] # and inventory_hostname == groups['haproxy'][0]
  shell: |
    cd /home/{{ansible_user}}/stacks
    docker stack deploy --compose-file=haproxy-stack.yml {{stack_name}} --with-registry-auth
  #become: yes
  run_once: true